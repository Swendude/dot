unbind Escape
unbind C-b
set-option -g prefix C-s
set-option -gu prefix2
bind-key C-s send-prefix

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind -n C-k resize-pane -U 5
bind -n C-j resize-pane -D 5
bind -n C-h resize-pane -L 5
bind -n C-l resize-pane -R 5

set -g @minimal-tmux-use-arrow false 
set -g @minimal-tmux-right-arrow ""
set -g @minimal-tmux-left-arrow ""
set -g @minimal-tmux-justify "center"
set -g @minimal-tmux-indicator true 
set -g mode-keys vi
set-option -sg escape-time 5
set -g extended-keys on

## Join windows: <prefix> s, <prefix> j
bind-key j command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:"  "join-pane -d -t '%%'"

set-option -a terminal-features 'xterm-256color:RGB'

set-option -g focus-events on
bind-key -T root KPEnter send-keys Escape O M
bind-key V select-layout even-vertical
bind-key H select-layout even-horizontal
bind-key P select-layout main-vertical \; resize-pane -t 0 -x 120

set -g @catppuccin_flavor 'frappe'
set -g @minimal-tmux-bg '#ca9ee6'
set -g @minimal-tmux-fg '#303446'

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
run ~/.config/tmux/plugins/minimal-tmux-status/minimal.tmux

set -g extended-keys-format csi-u
